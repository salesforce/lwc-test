name: Release

on:
    push:
        tags: ['v*']

permissions:
    contents: read

jobs:
    test:
        uses: ./.github/workflows/test.yml

    deploy:
        name: Deploy
        needs: test
        runs-on: ubuntu-latest
        # Only this job can request an OIDC token. A reusable workflow inherits the caller's
        # permissions, so a workflow-level id-token would also reach the test job.
        permissions:
            contents: read
            id-token: write # Required for OIDC
        steps:
            - uses: actions/checkout@v6
              with:
                  # Full history and remote branches, so publish.js can find the release branch
                  # that contains the tagged commit
                  fetch-depth: 0

            - uses: actions/setup-node@v6
              with:
                  node-version: '20.20.1'

            # This job can mint an npm token, so skip the yarn cache (the test jobs write to it) and
            # dependency install scripts (publishing doesn't need them)
            - name: Install dependencies
              run: yarn install --frozen-lockfile --ignore-scripts

            # No npm token: lerna exchanges the job's OIDC token for a short-lived token per package
            # (npm trusted publishing, configured on each package for this workflow file)
            - name: Publish packages
              run: yarn release:publish:ci
