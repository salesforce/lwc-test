name: Release

on:
    push:
        tags: ['v*']

permissions:
    id-token: write # Required for OIDC
    contents: read

jobs:
    test:
        uses: ./.github/workflows/test.yml

    deploy:
        name: Deploy
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  # Full history and remote branches, so publish.js can find the release branch
                  # that contains the tagged commit
                  fetch-depth: 0

            - uses: actions/setup-node@v6
              with:
                  node-version: '20.20.1'

            - name: Get yarn cache directory path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

            - uses: actions/cache@v4
              id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
              with:
                  path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            # No npm token: lerna exchanges the job's OIDC token for a short-lived token per package
            # (npm trusted publishing, configured on each package for this workflow file)
            - name: Publish packages
              run: yarn release:publish:ci
